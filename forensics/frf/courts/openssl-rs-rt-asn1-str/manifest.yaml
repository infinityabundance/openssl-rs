# openssl-rs court: the Phase 5 `rt-asn1-str` runtime surface.
#
# The subject is the transcript of a differential probe: one C program that
# prints one `key=value` line per observation while exercising
#
#     the string classification, table and printing surface: which of
#     PrintableString/IA5String/T61String a buffer fits in, the four-byte-per-
#     character narrowing, the raw printer's 80-octet blocking measured through a
#     write callback that records the chunk lengths, the mask-narrowing classifier
#     over its four input and four output encodings with its two size limits, the
#     28-row per-NID string table with the runtime stack that shadows it and the
#     global mask's STABLE_NO_MASK exemption, the five spellings of
#     ASN1_STRING_set_default_mask_asc, the two number printers, and the escaping
#     printer ASN1_STRING_print_ex over twenty-three flag sets and every one of the
#     256 byte values, with ASN1_STRING_to_UTF8 over each character type
#
# The same source is compiled against the admitted authority and against the
# candidate, each side executes its own binary, and FRF compares the
# transcripts.
#
# Scope: the observations the probe makes. It is NOT a claim about surface the
# probe does not touch, and not a cryptographic or security claim.

court:
  id: openssl-rs-rt-asn1-str
  question: >-
    For the rt-asn1-str runtime surface in fixture family rt-asn1-str, does
    the candidate produce the same observable transcript as the admitted
    authority OpenSSL 3.6.4 when both run the same probe over the same
    fixture?
  falsifier: >-
    Any observation line differs between the two transcripts, or either
    side's exit class differs.
  authority: openssl-rt-3.6.4-r2
  candidate:
    name: openssl-rs
    version_or_commit: "0.0.13"
    build_profile: linux-x86_64-default-shared-legacy-notests
    path: forensics/frf/refs/candidate-runtime-probe.sh
  fixture:
    id: probe-list.txt
    path: forensics/frf/courts/openssl-rs-rt-asn1-str/fixtures/probe-list.txt
    arguments: ["{fixture}", "phase5"]
  admissibility_envelope:
    fixture_family: rt-asn1-str
    platforms: ["x86_64-linux"]
    observables: [stdout, exit]
    normalizers: []
    replay_scope: single-run
  execution_context:
    artifacts:
      - path: forensics/frf/refs/authority-runtime-probe.sh
        role: child-executable
      - path: forensics/frf/refs/candidate-runtime-probe.sh
        role: child-executable
      - path: artifacts/phase5/probes/rt_asn1_str_probe.authority
        role: child-executable
      - path: artifacts/phase5/probes/rt_asn1_str_probe.candidate
        role: child-executable
      - path: courts/phase5/rt_asn1_str_probe.c
        role: data
      - path: forensics/authorities/prefix/openssl-3.6.4-production/lib/libcrypto.so.3
        role: runtime-library
      - path: artifacts/phase2/libcrypto.so.3
        role: runtime-library
  environment:
    LC_ALL: C
    TZ: UTC
