# openssl-rs court: the Phase 17 `rt-cli-bodies` runtime surface.
#
# The subject is the transcript of a differential probe: a shell probe that
# drives this side's `openssl` over a fixed argv and prints one `key=value`
# line per observation while exercising
#
#     the 52 landed CLI command bodies over a fixed argv, run through a per-side shell probe
#
# The same probe runs on each side -- the admitted authority's own `openssl`
# and the candidate distribution shell's -- and FRF compares the transcripts.
#
# Scope: the observations the probe makes. It is NOT a claim about surface the
# probe does not touch, and not a cryptographic or security claim.

court:
  id: openssl-rs-rt-cli-bodies
  question: >-
    For the rt-cli-bodies runtime surface in fixture family rt-cli-bodies, does
    the candidate produce the same observable transcript as the admitted
    authority OpenSSL 3.6.4 when both run the same probe over the same
    fixture?
  falsifier: >-
    Any observation line differs between the two transcripts, or either
    side's exit class differs.
  authority: openssl-rt-3.6.4-r2
  candidate:
    name: openssl-rs
    version_or_commit: "0.0.23"
    build_profile: linux-x86_64-default-shared-legacy-notests
    path: forensics/frf/refs/candidate-runtime-probe.sh
  fixture:
    id: probe-list.txt
    path: forensics/frf/courts/openssl-rs-rt-cli-bodies/fixtures/probe-list.txt
    arguments: ["{fixture}", "phase17"]
  admissibility_envelope:
    fixture_family: rt-cli-bodies
    platforms: ["x86_64-linux"]
    observables: [stdout, exit]
    normalizers: []
    replay_scope: single-run
  execution_context:
    artifacts:
      - path: forensics/frf/refs/authority-runtime-probe.sh
        role: child-executable
      - path: forensics/frf/refs/candidate-runtime-probe.sh
        role: child-executable
      - path: artifacts/phase17/probes/rt_cli_bodies_probe.authority
        role: child-executable
      - path: artifacts/phase17/probes/rt_cli_bodies_probe.candidate
        role: child-executable
      - path: courts/phase17/rt_cli_bodies_probe.sh
        role: data
      - path: forensics/authorities/prefix/openssl-3.6.4-production/lib/libcrypto.so.3
        role: runtime-library
      - path: artifacts/phase2/libcrypto.so.3
        role: runtime-library
  environment:
    LC_ALL: C
    TZ: UTC
