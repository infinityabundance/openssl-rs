# openssl-rs court: the Phase 5 `rt-asn1-time` runtime surface.
#
# The subject is the transcript of a differential probe: one C program that
# prints one `key=value` line per observation while exercising
#
#     the time family: the two RFC 5280 syntaxes read by their only parser (the
#     field-bounds tables, the leap-year calendar, the shortest legal spelling and
#     the fraction field), the two type guards, the offset `+hhmm` that is validated
#     without a destination and applied only with one, the RFC 5280 profile and the
#     `YYYY`->`YY` shortening, the four constructors and their year-window choice,
#     the Julian-day diff and compare answers, the three printer formats, the
#     duplicates and the two in-place converters
#
# The same source is compiled against the admitted authority and against the
# candidate, each side executes its own binary, and FRF compares the
# transcripts.
#
# Scope: the observations the probe makes. It is NOT a claim about surface the
# probe does not touch, and not a cryptographic or security claim.

court:
  id: openssl-rs-rt-asn1-time
  question: >-
    For the rt-asn1-time runtime surface in fixture family rt-asn1-time, does
    the candidate produce the same observable transcript as the admitted
    authority OpenSSL 3.6.4 when both run the same probe over the same
    fixture?
  falsifier: >-
    Any observation line differs between the two transcripts, or either
    side's exit class differs.
  authority: openssl-rt-3.6.4-r2
  candidate:
    name: openssl-rs
    version_or_commit: "0.0.14"
    build_profile: linux-x86_64-default-shared-legacy-notests
    path: forensics/frf/refs/candidate-runtime-probe.sh
  fixture:
    id: probe-list.txt
    path: forensics/frf/courts/openssl-rs-rt-asn1-time/fixtures/probe-list.txt
    arguments: ["{fixture}", "phase5"]
  admissibility_envelope:
    fixture_family: rt-asn1-time
    platforms: ["x86_64-linux"]
    observables: [stdout, exit]
    normalizers: []
    replay_scope: single-run
  execution_context:
    artifacts:
      - path: forensics/frf/refs/authority-runtime-probe.sh
        role: child-executable
      - path: forensics/frf/refs/candidate-runtime-probe.sh
        role: child-executable
      - path: artifacts/phase5/probes/rt_asn1_time_probe.authority
        role: child-executable
      - path: artifacts/phase5/probes/rt_asn1_time_probe.candidate
        role: child-executable
      - path: courts/phase5/rt_asn1_time_probe.c
        role: data
      - path: forensics/authorities/prefix/openssl-3.6.4-production/lib/libcrypto.so.3
        role: runtime-library
      - path: artifacts/phase2/libcrypto.so.3
        role: runtime-library
  environment:
    LC_ALL: C
    TZ: UTC
