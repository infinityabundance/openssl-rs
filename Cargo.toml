# openssl-rs — one Cargo package, one first-party implementation crate.
#
# Architectural constraints (see docs/CUSTODIAN_CONTRACT.md §2 and §3):
#
#   * This is the ONLY implementation crate. There is no workspace, and no
#     component crates (no openssl-core / openssl-provider / openssl-ssl / ...).
#     Internal modules may be arbitrarily numerous.
#
#   * The distribution artifacts OpenSSL consumers expect
#     (libcrypto.so.3, libssl.so.3, static archives, provider modules, the
#     `openssl` executable, public headers, pkg-config metadata) are emitted from
#     this single implementation via custom link/export machinery in Phase 2.
#     They are deliberately NOT claimed yet: crate-type is `rlib` only until the
#     export/link machinery and its ABI courts exist. See docs/ABI_POLICY.md.
#
#   * No forbidden implementation backend may ever appear in [dependencies].
#     The list is enforced by forensics/tools/check_forbidden_dependencies.py and
#     is reproduced here for visibility:
#
#         openssl, openssl-sys, rustls, rustls-ffi, aws-lc-rs, aws-lc,
#         boringssl, libressl, ring
#
#     Independent implementations may be used as *test authorities* in the
#     court container, never as the hidden product. See
#     docs/CUSTODIAN_CONTRACT.md §3.

[package]
name = "openssl-rs"
# 0.0.0 is reserved by Cargo for unpublished path/workspace members and cannot
# be published. 0.0.x is used deliberately: no product subsystem is implemented
# yet, and the version must not imply otherwise (docs/NON_CLAIMS.md).
version = "0.0.12"
edition = "2021"
rust-version = "1.98.1"
description = "Custodian-level native-Rust reconstruction of the OpenSSL 3.x contract"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/infinityabundance/openssl-rs"
homepage = "https://github.com/infinityabundance/openssl-rs"
documentation = "https://github.com/infinityabundance/openssl-rs/blob/main/forensics/STATUS.md"
keywords = ["openssl", "crypto", "abi", "compatibility", "custodian"]
categories = ["cryptography", "api-bindings"]

# Only the implementation, its constitution and its tests ship. Everything
# else is *excluded* explicitly rather than allow-listed, because allow-listing
# proved to have surprising behaviour: an `include` list still pulled stray
# `README.md` files out of the authority source tree, which would have
# redistributed upstream files unnecessarily.
#
# Excluded and why:
#   forensics/atlas          ~73 MB of generated evidence; reproducible from the
#                            receipts in the repository, so shipping it would
#                            bloat every downstream `cargo fetch`.
#   forensics/authorities/*  ~628 MB of archives, source trees and build
#                            products, all reproducible from AUTHORITIES.json.
#   forensics/tools          evidence generators; they run in the court, not in
#                            a consumer's build.
#   docker/, courts/         court scaffolding, not product.
# Included deliberately:
#   forensics/authorities/AUTHORITIES.json   required by build.rs to bind the
#                            binary to the authority it was built against.
#   tests/**                 the crate's own evidence-binding tests.
exclude = [
    "forensics/atlas/**",
    "forensics/tools/**",
    "forensics/receipts/**",
    "forensics/STATUS.md",
    # The FRF store and its court declarations. The store is ~20 MB of captures
    # and content-addressed objects; the declarations reference absolute court
    # container paths. Neither is usable by a crate consumer.
    ".frf/**",
    "forensics/frf/**",
    "forensics/authorities/downloads/**",
    "forensics/authorities/src/**",
    "forensics/authorities/build/**",
    "forensics/authorities/prefix/**",
    "forensics/authorities/captures/**",
    "forensics/authorities/SOURCE_MANIFEST.*.json",
    "docker/**",
    "courts/**",
    # Scratch space written by courts and probes inside the container. It is
    # bind-mounted, so it lands on host disk, but it is neither evidence nor
    # product and must never reach a published package.
    "court/**",
    "artifacts/**",
    ".gemel/**",
    ".github/**",
]

# Phase 0/1 skeleton: library only. Distribution artifacts arrive in Phase 2
# together with the export/version-script machinery that makes them honest.
# The crate emits BOTH an rlib (for Rust consumers and tests) and a staticlib.
# The static archive is what forensics/tools/build_phase2.sh links, together with
# the generated scaffolds, into libcrypto.so.3 / libssl.so.3. The IMPLEMENTED set
# is derived from this crate's own source, so the shell generator never keeps a
# second list of what is implemented that could drift.
[lib]
name = "openssl_rs"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

# No dependencies. Everything the product does must be implemented here.
[dependencies]

[build-dependencies]

# Lints are part of the contract, not decoration (docs/UNSAFE.md,
# docs/RELEASE_GATES.md §6): no panic may unwind across the C ABI, and unsafe
# is confined and documented.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Courts must be able to reason about overflow.
overflow-checks = true

# NOTE: panic strategy is deliberately the default (`unwind`), NOT `abort`.
# An OpenSSL replacement is a *library*: aborting the caller's process on an
# internal defect is worse than returning the function's documented failure
# value. The unwind boundary in src/ffi/mod.rs converts a panic into that
# failure value, which is what `docs/UNSAFE.md` §3 requires. With `abort`, the
# boundary could not catch anything and the failure value would be unreachable.
# Set `panic = "abort"` only for the *court* binaries, never for the product.
