# openssl-rs — continuous integration
#
# The rule this workflow enforces is cumulative: **a commit may not undo an
# earlier commit's evidence**. A green "build + unit tests" check does not
# enforce that, because a *removed* implementation or a *weakened* probe has no
# failing test. The enforcement is `forensics/tools/regression_guard.py`.
#
# The baseline trust boundary
# ---------------------------
# The guard is given `--baseline-ref` pointing at the commit that *was* the
# branch tip before this push (or the merge base with the target branch for a
# pull request), and reads the baseline there **through git**. The candidate's own
# copy of `forensics/regression-baseline.json` is treated as a *proposed* baseline
# and is separately required to equal the observed evidence.
#
# That two-part check is what closes the loop. Without it a commit could delete
# implementations, run `regression_guard.py --update`, commit the lower baseline,
# and pass its own comparison. Now:
#
#   * lowering the baseline cannot help, because the authority is read from the
#     ref the candidate cannot edit;
#   * a stale proposed baseline fails, so the committed baseline always describes
#     the current evidence.
#
# Absence is never zero: if the authority recorded evidence for a plane and the
# candidate cannot produce that plane at all, the guard reports a regression
# rather than reading the gap as zero.
#
# Venues
# ------
# `static` runs only what needs no authority: build, pure unit tests, static
# checks, evidence determinism over committed inputs, and the regression guard.
# Per docs/CUSTODIAN_CONTRACT.md §11 none of that is forensic parity evidence.
# `courts` is the venue that produces evidence: it builds the pinned authority and
# re-runs every court from scratch.
#
# See docs/CI.md.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # A hard gate. `docs/UNSAFE.md` requires a `# Safety` section on every
    # `unsafe fn` and a `SAFETY:` comment on every `unsafe` block, and clippy
    # enforces both (`undocumented_unsafe_blocks`, `missing_safety_doc` = deny).
    #
    # This job carried `continue-on-error: true` while the Phase 4 BIO and CONF
    # modules still owed that documentation: ~520 diagnostics, all of them the
    # missing-invariant kind. They were cleared rather than suppressed, because
    # the policy is real and an `allow` would have hidden exactly the unsafe code
    # a reader most needs annotated. The one line was deleted when the count
    # reached zero, and it is now a required gate like the others.
    name: lints (clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  static:
    name: static gates (build, tests, determinism, no-regression)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The trusted baseline is read through git, so the history has to be
          # present. 0 fetches everything the default branch needs.
          fetch-depth: 0

      - name: Toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --release

      # Pure Rust tests: no authority, and per docs/CUSTODIAN_CONTRACT.md §11 they
      # are not forensic evidence. Everything authority-bearing is in `courts`.
      - name: Unit tests
        run: cargo test --lib -- --test-threads=1

      - name: Forbidden implementation backends
        run: python3 forensics/tools/check_forbidden_dependencies.py

      # The dependency surface is a contract; a stray dependency is a supply-chain
      # decision, so it is asserted rather than merely absent.
      - name: No dependencies
        run: |
          python3 - <<'PY'
          import tomllib, sys
          with open("Cargo.toml", "rb") as f:
              doc = tomllib.load(f)
          deps = doc.get("dependencies") or {}
          build = doc.get("build-dependencies") or {}
          if deps or build:
              print("unexpected dependencies:", deps, build)
              sys.exit(1)
          print("no dependencies declared (ok)")
          PY

      # Every generated artefact is a function of committed inputs, so
      # regenerating it must reproduce it. Build-product digests are normalised
      # and reported; everything else is compared exactly.
      - name: Evidence determinism
        run: python3 forensics/tools/evidence_determinism.py

      # An export that matches no phase family is invisible to every ledger at
      # once, so the shell scaffolds it and no obligation records it. That has
      # happened twice (D49, D51) and was found by reading both times. This makes
      # the invariant mechanical: no implemented export may be unowned.
      - name: Symbol ownership
        run: python3 forensics/tools/ownership_audit.py

      # The atlas records every authority prototype and nothing compared it with the
      # crate's declarations, which is how `BN_signed_lebin2bn` came to be declared
      # `-> c_int` while the authority declares `BIGNUM *` (D65). This compares
      # return class and arity for every implemented export.
      - name: Export prototypes
        run: python3 forensics/tools/prototype_court.py

      # A court declaration is written by `gen_frf_courts.py` from one table, so a
      # hand-edit to a single manifest cannot survive: the table and the
      # declarations must agree. This is also what keeps every court's
      # `version_or_commit` moving together at a release instead of the ones
      # somebody remembered.
      - name: FRF court declarations match their table
        run: python3 forensics/tools/gen_frf_courts.py --check

      # Determinism alone cannot catch a generator that depends on the host's
      # binutils: on any single machine both sides use the same tools and agree.
      # This stubs them out of PATH and requires the evidence to reproduce
      # anyway. It is the gate that keeps D33's fix from being undone.
      - name: Evidence portability (no host binutils)
        run: python3 forensics/tools/check_evidence_portability.py

      - name: Resolve trusted baseline ref
        id: baseline
        run: |
          set -eu
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            REF="$(git merge-base HEAD FETCH_HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && \
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              REF="$BEFORE"
            else
              git fetch --no-tags origin "${GITHUB_REF_NAME}"
              REF="$(git merge-base HEAD FETCH_HEAD)"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "trusted baseline ref: $REF"
          git --no-pager log -1 --oneline "$REF"

      # Two checks in one invocation:
      #   1. no regression against the baseline at the trusted ref;
      #   2. the proposed baseline in the working tree equals the observed
      #      evidence, so the committed baseline cannot go stale.
      - name: Regression guard
        run: |
          python3 forensics/tools/regression_guard.py \
            --baseline-ref "${{ steps.baseline.outputs.ref }}" \
            --require-current \
            --allow-missing-baseline

  courts:
    name: every active stratum's courts, and the re-derived guard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repository is bind-mounted at /work and the container runs as root, so
      # anything it creates lands on host disk owned by root. `court/` is shared
      # scratch: `build_phase2.sh` and the court harnesses create subdirectories
      # inside it, and the baseline extraction further down runs as the *runner*
      # user. Creating the directory here, before the container can, is what keeps
      # that later write permission-clean; otherwise git show fails with
      # "court/trusted-baseline.json: Permission denied".
      - name: Prepare the shared scratch directory
        run: mkdir -p court

      - name: Build court image
        run: bash docker/openssl-rs-court.sh build

      - name: Start court container
        run: bash docker/openssl-rs-court.sh up

      - name: Court preconditions
        run: bash docker/openssl-rs-court.sh verify

      # The authority is acquired from the upstream release and verified against
      # the hash in forensics/authorities/AUTHORITIES.json; a mismatch is fatal.
      - name: Acquire authority
        run: bash docker/openssl-rs-court.sh exec python3 forensics/tools/authority_acquire.py --all

      - name: Build authority
        run: bash docker/openssl-rs-court.sh exec python3 forensics/tools/authority_build.py --all

      # Every active stratum's courts, in numeric order: the Phase 2 shell first,
      # because every later court links against it. This step used to enumerate the
      # runners by name and named three of the four, so Phase 5's nine courts -- RT-BN,
      # the six ASN.1 courts, RT-BIO-ASN1 and RT-PEM -- were never reproduced here and
      # their committed JSON was read as evidence instead. The list now comes from
      # `forensics/phase-state.json`, and `run_courts.py` deletes each phase's committed
      # `COURTS.json` before regenerating it, then fails if the committed file claimed a
      # result this run does not reproduce. See docs/DECISIONS.md D94.
      - name: Every active stratum's courts, derived from the phase registry
        run: bash docker/openssl-rs-court.sh exec python3 forensics/tools/run_courts.py

      - name: Resolve trusted baseline ref
        id: baseline
        run: |
          set -eu
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            REF="$(git merge-base HEAD FETCH_HEAD)"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && \
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              REF="$BEFORE"
            else
              git fetch --no-tags origin "${GITHUB_REF_NAME}"
              REF="$(git merge-base HEAD FETCH_HEAD)"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "trusted baseline ref: $REF"

      # The authority baseline is extracted on the runner and handed to the
      # container through the bind-mounted `court/` scratch directory, because the
      # container does not own the repository it is given as a bind mount and git
      # therefore refuses to read it. Extraction here, on the runner, is what keeps
      # the authority out of the candidate's reach.
      - name: Extract the trusted baseline
        run: |
          mkdir -p court
          git show "${{ steps.baseline.outputs.ref }}:forensics/regression-baseline.json" \
            > court/trusted-baseline.json
          echo "authority baseline:"
          head -c 200 court/trusted-baseline.json; echo

      # Run against the freshly derived results, not the committed ones: this is
      # what makes the gate behavioural rather than a claim about a file.
      - name: Regression guard (re-derived evidence)
        run: |
          bash docker/openssl-rs-court.sh exec python3 \
            forensics/tools/regression_guard.py \
            --baseline-file /work/court/trusted-baseline.json

      - name: Stop court container
        if: always()
        run: bash docker/openssl-rs-court.sh down
