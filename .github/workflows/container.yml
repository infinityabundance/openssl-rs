# openssl-rs — container package
#
# Publishes the project's court image to GitHub Packages (`ghcr.io`) so the
# container the courts run in is available as a versioned artefact rather than
# only as a Dockerfile in the repository.
#
# Why a separate workflow
# -----------------------
# `ci.yml` is the correctness gate: it builds, tests, and re-derives evidence,
# and its required checks must not be short-circuited by a registry push. This
# workflow has one job and cannot influence that gate. It runs on release tags
# and on manual dispatch, so publishing an image is never an implicit
# consequence of an ordinary commit.
#
# Why `GITHUB_TOKEN`
# ------------------
# A container push to `ghcr.io` needs `write:packages`. The repository's
# credentials on the maintainer's machine carry `repo`/`gist`/`read:org` only,
# and the registry answers 403 for them; the workflow token is scoped
# per-repository and is revoked with the run, so it is the smaller credential.
#
# What this does not claim
# ------------------------
# A published image is a packaging artefact. It is not a safety, compatibility
# or cryptographic result, and pushing it discharges no obligation.

name: container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.0.49)"
        required: true
        type: string
      delete_package:
        description: "Optional: repository-scoped container package to delete after publishing (e.g. a superseded name)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and push ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME#v}"; fi
          case "$tag" in
            ""|*[!A-Za-z0-9._-]*)
              echo "refusing to publish with tag '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing tag: $tag"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # The Dockerfile copies its entrypoint from the same directory, so the
          # build context is `docker/`, not the repository root.
          context: docker
          file: docker/openssl-rs-court.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openssl-rs:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/openssl-rs:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=openssl-rs
            org.opencontainers.image.description=Court container for the openssl-rs memory-safety campaign: pinned toolchain, no system OpenSSL.
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0 OR MIT

      # Deleting a package needs the packages permission, which the maintainer's
      # own credential does not carry. The run token does, so a superseded
      # package name is retired here rather than left public next to the
      # correct one. Opt-in by name; a mistyped or already-deleted name fails
      # the job instead of passing silently.
      - name: Delete superseded package
        if: github.event_name == 'workflow_dispatch' && inputs.delete_package != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${{ inputs.delete_package }}"
          echo "deleting repository-scoped container package: $pkg"
          gh api -X DELETE "/repos/${{ github.repository }}/packages/container/$pkg"
          echo "deleted $pkg"
